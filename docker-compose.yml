# Lancement local rapide (dev) sans Kubernetes : docker compose up --build
services:
  backend:
    build: ./backend
    ports:
      - "3001:3001"
    environment:
      - NODE_ENV=development
      - PORT=3001

  frontend:
    build:
      context: ./frontend
      args:
        REACT_APP_API_URL: http://localhost:3001
    ports:
      - "8080:8080"
    depends_on:
      - backend
