apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ecommerce
  namespace: ecommerce
spec:
  ingressClassName: nginx
  rules:
    - host: ecommerce.local
      http:
        paths:
          # Backend keeps its /api prefix (no rewrite): /api/products -> backend /api/products
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: backend
                port: { number: 3001 }
          # Everything else goes to the React SPA
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port: { number: 80 }
